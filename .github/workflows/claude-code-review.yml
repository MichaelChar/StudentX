name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # The plugin stops at its step 1 on a draft without posting anything, which
    # the guard below would (correctly) call a hollow run. Skip drafts outright;
    # `ready_for_review` starts the review when the PR is un-drafted.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write scopes are required for the action to actually post inline review
      # comments and a top-level conversation comment. With read-only the
      # Claude SDK still runs (logs show clean success), but the post-comment
      # step is a silent no-op — the review is generated, then dropped.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Lower bound for the guard below: only comments created after this count
      # as this run's review.
      - name: Mark review start
        run: echo "REVIEW_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` is what makes the review visible. Without it the plugin's
          # command stops after step 7 — "If `--comment` argument was NOT provided,
          # stop here. Do not post any GitHub comments." — so the review runs, spends
          # the tokens, writes its findings to a log the action sanitises, and drops
          # them. Every green run before 2026-08-21 did exactly that: #390, #391 and
          # #397 all reviewed cleanly and posted nothing. The write scopes granted in
          # #55 were the other half of this; they are useless on their own.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # #581's `Report review run` step showed why a run can end green in
          # ~14 s with nothing posted (see (1) and (2)).
          #
          # 1. Background subagents. The subagents launched in the background, and
          #    the top-level agent ended its turn to "wait for both before
          #    proceeding". The action's SDK loop stops at the first `result`
          #    message (run-claude-sdk.ts), so that ended the session, reported as
          #    success. CLAUDE_CODE_DISABLE_BACKGROUND_TASKS turns background
          #    subagents off. It goes through `settings` because a step-level
          #    `env:` never reaches Claude: the action's run step declares its own
          #    env map, which shadows the caller's (action.yml, "MCP configuration"
          #    comment). `settings` is merged into ~/.claude/settings.json, and
          #    Claude Code applies its `env` block to its own process.
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}
          # 2. Tool permissions. Headless, a tool call that needs permission and
          #    isn't allowlisted is denied, not prompted. `Skill` is how the model
          #    invokes the plugin's command; #581 was denied it and improvised the
          #    steps. In agent mode the action installs the `github_inline_comment`
          #    MCP server ONLY when its tool is listed here (install-mcp-server.ts),
          #    and the plugin posts every finding through it.
          #
          #    The rest mirrors the plugin's own `allowed-tools` frontmatter, plus
          #    the read-only tools its subagents use on the checkout. Bare `Skill`
          #    is broader than the one command, but only this job's plugins are
          #    installed here.
          claude_args: |
            --allowedTools "Skill,Read,Grep,Glob,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action pipes the SDK stream through a sanitiser ("full output hidden
      # for security"), so the log carries only the result envelope's counters —
      # a run that stopped early and one that reviewed look the same apart from
      # num_turns. This step prints enough of the execution file to say WHY a run
      # ended where it did: which tools were available, every tool call (name plus
      # a short summary of its input), each permission denial, and the model's
      # final message. It deliberately omits tool RESULTS (file contents, command
      # output), which is where anything sensitive would be, and what the
      # sanitiser exists to protect. The repo is public, so this log is too; the
      # final message is the review summary that gets posted to the PR anyway.
      - name: Report review run
        if: always() && steps.claude-review.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -uo pipefail
          FILE="${EXECUTION_FILE:-}"
          [ -n "$FILE" ] || FILE="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$FILE" ]; then
            echo "no execution output at $FILE"
            exit 0
          fi
          msgs() { jq -c 'if type == "array" then .[] else . end' "$FILE"; }

          echo "::group::Session"
          msgs | jq -r 'select(.type == "system" and .subtype == "init")
            | "model: \(.model)\npermissionMode: \(.permissionMode)",
              "plugins: \([.plugins[]?.name] | join(", "))",
              "mcp servers: \([.mcp_servers[]? | "\(.name)=\(.status)"] | join(", "))",
              "mcp tools: \([.tools[]? | select(startswith("mcp__"))] | join(", "))",
              "code-review command loaded: \([.slash_commands[]? | select(test("code-review"))] | length > 0)"'
          echo "::endgroup::"

          echo "::group::Tool calls (main = top-level agent, sub = subagent)"
          msgs | jq -r 'select(.type == "assistant") | .parent_tool_use_id as $p
            | .message.content[]? | select(.type == "tool_use")
            | "\(if $p then " sub" else "main" end)  \(.name)  \(.input
                | if .command then .command
                  elif .subagent_type or .description then "[\(.subagent_type // "")\(if .model then "/" + .model else "" end)] \(.description // "")"
                  elif .path then "\(.path):\(.line // "") confirmed=\(.confirmed // false)"
                  elif .file_path then .file_path
                  elif .pattern then .pattern
                  else "" end
                | tostring | gsub("\n"; " ") | .[0:200])"'
          echo "::endgroup::"

          echo "::group::Result"
          msgs | jq -r 'select(.type == "result")
            | "subtype=\(.subtype) is_error=\(.is_error) num_turns=\(.num_turns) duration_ms=\(.duration_ms) total_cost_usd=\(.total_cost_usd) terminal_reason=\(.terminal_reason // "") api_error_status=\(.api_error_status // "")",
              "permission denials: \(.permission_denials // [] | length)",
              (.permission_denials // [] | .[] | "  denied \(.tool_name): \(.tool_input | (.command // .) | tostring | gsub("\n"; " ") | .[0:200])"),
              "--- final message ---",
              ((.result // "") | tostring | .[0:4000])'
          echo "::endgroup::"

      # A green check must mean a review reached the PR. The plugin always posts
      # when it finishes with `--comment` — inline comments, or "No issues found"
      # — so a successful run that posted nothing stopped early, and is failed
      # here with the final message (printed above) as the reason. That is the
      # state this job sat in, green, from 2026-09-13 to 2026-09-26.
      #
      # Two non-failures:
      # - The action refuses to run on a PR that edits this file (it must match
      #   main's copy) and exits success without invoking Claude. Nothing can be
      #   reviewed there, by design; warn rather than fail every such PR.
      # - The plugin reviews a PR once: step 1 stops if Claude already commented.
      #   A later push with an earlier review on the PR is a notice, not a failure.
      - name: Require a posted review
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          FILE="${EXECUTION_FILE:-}"
          [ -n "$FILE" ] || FILE="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$FILE" ]; then
            echo "::warning title=No review ran::The action exited without invoking Claude — most often because this PR edits .github/workflows/claude-code-review.yml, which the action requires to match main. This job is green but nothing was reviewed."
            exit 0
          fi

          # claude[bot] when the action mints its app token; github-actions[bot]
          # if the workflow is ever given `github_token` instead. claude.yml's
          # @claude mode also posts as claude[bot], replying to review comments,
          # so replies are excluded: the review's inline findings are top-level.
          BOT='(.user.login == "claude[bot]" or .user.login == "github-actions[bot]")'
          review_comments() { # $1 = jq condition on created_at
            {
              gh api --paginate "repos/$REPO/issues/$PR/comments" \
                --jq ".[] | select($BOT)
                          | select(.body | startswith(\"## Code review\"))
                          | select($1) | .html_url"
              gh api --paginate "repos/$REPO/pulls/$PR/comments" \
                --jq ".[] | select($BOT) | select(.in_reply_to_id == null)
                          | select($1) | .html_url"
            } | sort -u
          }

          posted=$(review_comments ".created_at >= \"$REVIEW_STARTED\"")
          if [ -n "$posted" ]; then
            echo "Review posted ($(echo "$posted" | wc -l | tr -d ' ') comment(s)):"
            echo "$posted"
            exit 0
          fi

          earlier=$(review_comments ".created_at < \"$REVIEW_STARTED\"")
          if [ -n "$earlier" ]; then
            echo "::notice title=Already reviewed::This run posted nothing, and the PR already carries a Claude review — the plugin reviews a PR once and stops at its step 1 on later pushes. Earlier review: $(echo "$earlier" | head -1)"
            exit 0
          fi

          echo "::error title=Hollow review::Claude ran and exited success but posted no review comment on this PR. See the 'Report review run' step for its final message, tool calls and permission denials."
          exit 1
