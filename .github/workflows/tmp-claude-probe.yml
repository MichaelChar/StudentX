# TEMPORARY — diagnosis only, deleted before this PR merges.
# Runs claude-code-action on a trivial prompt with show_full_output enabled, so
# the SDK's actual error text reaches the log. The prompt touches no PR content,
# so there is nothing to sanitise. This exists because the review workflow's own
# failure is unreadable, and the action skips (rather than runs) on any PR that
# edits its workflow file.
name: tmp claude probe

on:
  push:
    branches: [fix/claude-review-diagnostics]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Reply with exactly: OK. Do not use any tools.'
          show_full_output: true
