# Backstop for issue #251.
#
# `.gitignore` ignores `.env*` but deliberately un-ignores `.env.production`,
# which is tracked and committed. Today that file holds only NEXT_PUBLIC_*
# values, all public by construction — but nothing MAKES that true. The risk
# is drift: someone adds SUPABASE_SERVICE_ROLE_KEY or STRIPE_SECRET_KEY to
# the file that is already in the commit, and it ships silently.
#
# This job is the thing that notices. It is not a substitute for the rule
# (only public-by-construction values go in .env.production) — it is what
# catches the day somebody forgets the rule.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the diff — a secret that was
          # committed and later removed is still in the pack and still
          # compromised. Shallow clone would hide exactly that case.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required for pull_request events since gitleaks-action v2's
          # breaking change — without it the job dies in ~6s with
          # "GITHUB_TOKEN is now required to scan pull requests", which
          # looks like a finding in the checks list but is not one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action requires GITLEAKS_LICENSE only for repos owned by
          # a GitHub *Organization*. MichaelChar/StudentX is a user-owned
          # public repo, so it runs free — the job log confirms
          # "[MichaelChar] is an individual user. No license key is required."
          # If StudentX ever moves under an org, this starts failing on a
          # licence error rather than on a finding; read the error before
          # assuming a leak.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
